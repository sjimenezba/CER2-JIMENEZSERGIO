{% extends 'catalogo/base.html' %}

{% block content %}

<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-dark text-white text-center">
                <h3>Iniciar Sesion</h3>
            </div>
            <div class="card-body">
                {% if form.errors %}
                    <div class="alert alert-danger">Usuario o Contraseña incorrectos. Intenta de nuevo</div>
                {% endif %}
            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label">Nombre de Usuario</label>
                    {{ form.username }}
                </div>
                <div class="mb-3">
                    <label for="id_password" class="form-label">Contraseña</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Ingresar al Sistema</button>
            </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
