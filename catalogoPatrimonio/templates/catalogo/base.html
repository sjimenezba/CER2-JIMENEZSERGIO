<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fundacion Patrimonio Vivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">Patrimonio Vivo</a>
            <div class="navbar-nav w-100">
                <a class="nav-link" href="{% url 'catalogo' %}">Catálogo</a>
                <div class="ms-auto d-flex">
                    {% if user.is_authenticated %}
                        <a class="btn btn-warning btn-sm me-3" href="{% url 'gestion' %}">Panel de Gestión</a>
                        <span class="navbar-text me-3 text-white">Hola, {{ user.username }}</span>
                        <form action="{% url 'logout' %}" method="post">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
                        </form>
                    {% else %}
                        <a href="{% url 'login' %}" class="btn btn-outline-success btn-sm">Iniciar Sesión</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
